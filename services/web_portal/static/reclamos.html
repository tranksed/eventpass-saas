<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Libro de Reclamaciones Virtual — EventPass Perú</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/static/shared.css" />
</head>
<body>
  <div id="epNavbarHost"></div>

  <main class="container py-4" style="max-width:780px;">
    <div class="ep-card p-4">
      <div class="d-flex align-items-center gap-3 mb-3">
        <span class="ep-brand-mark"><i class="bi bi-journal-bookmark-fill"></i></span>
        <div>
          <h1 class="h4 fw-bold mb-0">Libro de Reclamaciones Virtual</h1>
          <small class="text-secondary">Conforme al Código de Protección y Defensa del Consumidor (INDECOPI - Perú)</small>
        </div>
      </div>
      <hr class="border-secondary-subtle" />

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label small">Evento relacionado (opcional)</label>
          <select id="recEventId" class="form-select">
            <option value="">-- Consulta General Plataforma --</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small">Tipo de Registro</label>
          <select id="recType" class="form-select">
            <option value="RECLAMO">RECLAMO (Disconformidad sobre entrada o servicio)</option>
            <option value="QUEJA">QUEJA (Malestar sobre atención al público)</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label small">DNI / CE</label>
          <input id="recDni" class="form-control" placeholder="8 dígitos" />
        </div>
        <div class="col-md-4">
          <label class="form-label small">Nombre completo</label>
          <input id="recName" class="form-control" placeholder="Nombre y apellidos" />
        </div>
        <div class="col-md-4">
          <label class="form-label small">Correo electrónico</label>
          <input id="recEmail" type="email" class="form-control" placeholder="correo@ejemplo.pe" />
        </div>
        <div class="col-12">
          <label class="form-label small">Detalle del reclamo o queja</label>
          <textarea id="recDetail" rows="4" class="form-control" placeholder="Describe lo ocurrido y el pedido concreto..."></textarea>
        </div>
      </div>

      <button class="btn btn-warning fw-semibold mt-3" onclick="submitComplaint()">
        <i class="bi bi-send-check me-1"></i>Registrar Hoja de Reclamación
      </button>
      <div id="recMsg"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/shared.js"></script>
  <script>
    EP.renderNavbar("reclamos");

    async function loadEvents() {
      try {
        const events = await EP.api("/api/v1/registration/public/events", { auth: false });
        const sel = document.getElementById("recEventId");
        sel.innerHTML = `<option value="">-- Consulta General Plataforma --</option>` +
          events.map(e => `<option value="${e.id}" data-tid="${e.tenant_id}">${EP.escapeHtml(e.name)}</option>`).join("");
      } catch {}
    }

    async function submitComplaint() {
      const sel = document.getElementById("recEventId");
      const opt = sel.selectedOptions[0];
      try {
        const res = await EP.api("/api/v1/registration/public/complaints", {
          method: "POST",
          auth: false,
          body: JSON.stringify({
            event_id: sel.value || null,
            tenant_id: opt && opt.dataset.tid ? opt.dataset.tid : null,
            dni: document.getElementById("recDni").value,
            full_name: document.getElementById("recName").value,
            email: document.getElementById("recEmail").value,
            claim_type: document.getElementById("recType").value,
            detail: document.getElementById("recDetail").value,
          }),
        });
        EP.showMsg("recMsg", "ok", `Hoja registrada correctamente. Código de seguimiento: ${res.complaint_code}`);
      } catch (e) {
        EP.showMsg("recMsg", "err", e.message);
      }
    }
    loadEvents();
  </script>
</body>
</html>
