worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Rate limiting zones for 10k/48h burst protection
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=checkout_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=checkin_limit:10m rate=60r/s;

    server {
        listen 80;
        server_tokens off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Block direct external access to internal S2S endpoints
        location /internal/ {
            return 403;
        }

        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://auth-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/registration/ {
            limit_req zone=checkout_limit burst=40 nodelay;
            proxy_pass http://registration-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/accreditation/ {
            limit_req zone=checkin_limit burst=100 nodelay;
            proxy_pass http://accreditation-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/audit/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://audit-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Web Portal UI & BFF routes (/, /comprar, /validar, /admin, /acreditacion, /static)
        location / {
            proxy_pass http://web-portal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
