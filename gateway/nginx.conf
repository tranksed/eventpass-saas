worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Rate limiting zones for 10k/48h burst protection
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=checkout_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=checkin_limit:10m rate=60r/s;

    server {
        listen 80;
        listen 443 ssl default_server;
        server_tokens off;
        client_max_body_size 15m;

        # SSL / TLS Modern Security Configuration
        ssl_certificate /etc/nginx/ssl/active_cert.pem;
        ssl_certificate_key /etc/nginx/ssl/active_key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # ACME Challenge for Let's Encrypt Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Block direct external access to internal S2S endpoints
        location /internal/ {
            return 403;
        }

        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://auth-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/registration/ {
            limit_req zone=checkout_limit burst=40 nodelay;
            proxy_pass http://registration-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/accreditation/ {
            limit_req zone=checkin_limit burst=100 nodelay;
            proxy_pass http://accreditation-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/audit/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://audit-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Web Portal UI & BFF routes (/, /comprar, /validar, /admin, /acreditacion, /static)
        location / {
            proxy_pass http://web-portal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
