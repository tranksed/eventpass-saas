[project]
name = "eventpass-saas"
version = "0.1.0"
description = "Multi-tenant high-security SaaS platform for event registration, ticketing, and private staff/participant accreditation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "greenlet>=3.1.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "cryptography>=43.0.0",
    "pyjwt>=2.9.0",
    "pyotp>=2.9.0",
    "httpx>=0.27.0",
    "qrcode>=8.0",
    "pillow>=10.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
